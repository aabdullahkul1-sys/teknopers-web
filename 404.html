<title>Sayfa Bulunamadı (404) | TEKNOPERS</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#F6F8FB;color:#0B1424;font-family:'Figtree',sans-serif;line-height:1.65;min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;
  background-image:linear-gradient(to right,rgba(11,20,36,.03) 1px,transparent 1px),linear-gradient(to bottom,rgba(11,20,36,.03) 1px,transparent 1px);background-size:34px 34px}
.box{max-width:520px}
.lg{width:64px;height:64px;border-radius:18px;background:linear-gradient(135deg,#FFCF3F,#E5A800);color:#0B1424;display:flex;align-items:center;justify-content:center;font-family:'Sora',sans-serif;font-weight:800;font-size:34px;margin:0 auto 24px;box-shadow:0 8px 24px rgba(229,168,0,.35)}
.code{font-family:'Sora',sans-serif;font-weight:800;font-size:clamp(56px,14vw,88px);line-height:1;color:#0B1424;letter-spacing:-.02em}
h1{font-family:'Sora',sans-serif;font-weight:700;font-size:clamp(20px,4vw,26px);margin:10px 0 12px}
p{color:#4B5A70;font-size:16px;margin-bottom:26px}
.btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:15px;padding:14px 26px;border-radius:14px;text-decoration:none;transition:transform .15s ease}
.btn:active{transform:scale(.97)}
.btn-navy{background:#0B1424;color:#fff}
.btn-ghost{background:#fff;color:#0B1424;border:1px solid #D3DCE8}
a{color:inherit}
</style>
</head>
<body>
  <div class="box">
    <div class="lg">T</div>
    <div class="code">404</div>
    <h1>Aradığınız sayfa bulunamadı</h1>
    <p>Sayfa taşınmış veya kaldırılmış olabilir. Ana sayfaya dönebilir ya da ücretsiz hesaplama araçlarımıza göz atabilirsiniz.</p>
    <div class="btns">
      <a class="btn btn-navy" href="/">Ana Sayfa</a>
      <a class="btn btn-ghost" href="/araclar/">Hesaplama Araçları</a>
    </div>
  </div>
</body>
